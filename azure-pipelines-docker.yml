# EpicBook Docker Compose Pipeline
# Uses the existing ubuntu-pool self-hosted agent.
# Uses the existing agent.pem Secure File for SSH deployment.

trigger:
  branches:
    include:
      - capstone/theepicbook-docker
  paths:
    include:
      - backend
      - frontend
      - proxy
      - docker-compose.yml
      - azure-pipelines-docker.yml

pool:
  name: 'ubuntu-pool'

variables:
  - group: Epicbook-docker-secrets
  - name: sshSecureFileName
    value: 'agent.pem'
  - name: imageTag
    value: '$(Build.SourceBranchName)-$(Build.SourceVersion)'

stages:

  # STAGE 1: Build and Push
  - stage: BuildAndPush
    displayName: 'Build and Push Images'
    jobs:
      - job: Build
        displayName: 'Build and push backend/frontend images'
        steps:
          - checkout: self
            displayName: 'Checkout repository'

          - script: |
              set -e
              echo "$(dockerHubToken)" | docker login \
                -u "$(dockerHubUsername)" --password-stdin
            displayName: 'Log in to Docker Hub'

          - script: |
              set -e
              docker build \
                -t $(dockerHubUsername)/epicbook-backend:$(imageTag) \
                -t $(dockerHubUsername)/epicbook-backend:latest \
                ./backend

              docker push $(dockerHubUsername)/epicbook-backend:$(imageTag)
              docker push $(dockerHubUsername)/epicbook-backend:latest
            displayName: 'Build and push backend image'

          - script: |
              set -e
              docker build \
                -t $(dockerHubUsername)/epicbook-frontend:$(imageTag) \
                -t $(dockerHubUsername)/epicbook-frontend:latest \
                ./frontend

              docker push $(dockerHubUsername)/epicbook-frontend:$(imageTag)
              docker push $(dockerHubUsername)/epicbook-frontend:latest
            displayName: 'Build and push frontend image'

          - script: |
              docker logout
            displayName: 'Log out of Docker Hub'
            condition: always()

  # STAGE 2: Deploy
  - stage: Deploy
    displayName: 'Deploy to VM'
    dependsOn: BuildAndPush
    jobs:
      - job: Deploy
        displayName: 'SSH in and restart the stack'
        steps:
          - checkout: self
            displayName: 'Checkout repository'

          - task: DownloadSecureFile@1
            name: downloadSSHKey
            displayName: 'Download existing agent.pem'
            inputs:
              secureFile: '$(sshSecureFileName)'

          - script: |
              set -e
              chmod 600 "$(downloadSSHKey.secureFilePath)"
            displayName: 'Set SSH private key permissions'

          - script: |
              set -e

              ssh -i "$(downloadSSHKey.secureFilePath)" \
                -o StrictHostKeyChecking=no \
                ubuntu@$(vmPublicIp) \
                'mkdir -p ~/theepicbook/proxy'

              scp -i "$(downloadSSHKey.secureFilePath)" \
                -o StrictHostKeyChecking=no \
                docker-compose.yml \
                ubuntu@$(vmPublicIp):~/theepicbook/

              scp -i "$(downloadSSHKey.secureFilePath)" \
                -o StrictHostKeyChecking=no \
                proxy/nginx.conf \
                ubuntu@$(vmPublicIp):~/theepicbook/proxy/
            displayName: 'Copy Compose and Nginx configuration'

          - script: |
              set -e

              ssh -i "$(downloadSSHKey.secureFilePath)" \
                -o StrictHostKeyChecking=no \
                ubuntu@$(vmPublicIp) '
                  set -e
                  cd ~/theepicbook

                  sed -i "s|image: epicbook-backend:1.0|image: $(dockerHubUsername)/epicbook-backend:$(imageTag)|" docker-compose.yml

                  sed -i "s|image: epicbook-frontend:1.0|image: $(dockerHubUsername)/epicbook-frontend:$(imageTag)|" docker-compose.yml

                  docker pull $(dockerHubUsername)/epicbook-backend:$(imageTag)
                  docker pull $(dockerHubUsername)/epicbook-frontend:$(imageTag)

                  docker compose up -d --remove-orphans
                  docker compose ps
                '
            displayName: 'Pull images and restart Docker Compose'

  # STAGE 3: Verify
  - stage: Verify
    displayName: 'Verify deployment'
    dependsOn: Deploy
    jobs:
      - job: Verify
        displayName: 'Confirm the deployed application responds'
        steps:
          - script: |
              set -e
              sleep 15

              STATUS=$(curl -sS -o /dev/null \
                -w "%{http_code}" \
                --max-time 10 \
                http://$(vmPublicIp)/health)

              echo "Health check status: $STATUS"

              if [ "$STATUS" -ne 200 ]; then
                echo "Deployment verification failed: /health returned $STATUS"
                exit 1
              fi

              echo "===== Deployment Verification Summary ====="
              echo "Image tag deployed : $(imageTag)"
              echo "Public URL          : http://$(vmPublicIp)/"
              echo "Health check        : $STATUS OK"
              echo "============================================="
            displayName: 'Check /health endpoint'
